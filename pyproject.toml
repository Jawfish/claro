[project]
name = "claro"
version = "0.1.0"
description = "Claro - async-first Python test framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "msgspec>=0.20.0",
]

[project.scripts]
claro = "claro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claro"]

[dependency-groups]
dev = [
    "coverage>=7.13.0",
    "ruff>=0.14.10",
    "ty>=0.0.5",
]
